# 기존 API 명세서(v1.2.0)에 추가/변경되는 내용 초안입니다. 팀 합의 후 본 명세서에 합쳐주세요.
# 통신 방식: REST는 방 만들기/입장 두 가지만 쓰고, 방 안의 소식은 모두 소켓(Socket.IO)으로 주고받습니다.
# 이벤트 이름과 payload 타입은 shared/src/room.ts에 있습니다.
openapi: 3.0.0
info:
  title: AI Mafia API (추가분)
  version: 1.3.0-draft
x-changes-to-existing:
  - POST /api/room/create, POST /api/room/join 응답에 playerId, token 추가, join 응답에 roomCode 추가
  - 닉네임은 서버가 랜덤 배정 (방 생성 시 요청 본문 없음, 에러 예시의 "Nickname is required."는 삭제)
  - 에러 응답에 code 필드 추가 (예: ROOM_FULL). 프론트가 에러 종류별 안내 문구를 고르는 데 사용
  - POST /api/room/join 에러 추가 - 409 ROOM_FULL(정원 6명 초과), 409 ROOM_NOT_JOINABLE(이미 시작한 방)
  - 소켓 연결 쿼리는 nickname 대신 token (본인에게만 주는 추측 불가능한 값. 닉네임/번호는 남도 알 수 있어 사칭이 되므로)
  - chat:recieve 오타 -> chat:receive (v1.2.0 OpenAPI 본문은 이미 receive)
x-websocket-events:
  transport: WebSockets (/socket.io/)
  connectionQuery: "?roomCode=방코드&token=토큰"
  connectionRules:
    - 방 참가자가 아니면 연결이 거절되고 connect_error의 message가 에러 코드(ROOM_NOT_FOUND, NOT_A_MEMBER 등)
    - roomCode 없이 연결하는 소켓은 방과 무관한 연결로 통과 (연결 상태 확인용)
    - REST(create/join) 뒤에 소켓이 연결되지 않은 채 15초가 지나면 대기실에서는 나간 것으로 처리
  clientToServer:
    room:getState:
      ack: "{ success, room }  # 화면이 열릴 때와 (재)연결될 때마다 호출해 현재 단계/참가자를 맞춘다"
    result:get:
      ack: "{ success, result }  # 방 상태가 ended일 때만 성공, 그 전에는 { success: false, code: RESULT_NOT_READY }"
    room:rematch:
      ack: "{ success, players }  # 대기실로 되돌리고 닉네임 새로 배정. 이미 대기실이면 변경 없이 성공. 진행 중이면 ROOM_NOT_ENDED"
    room:leave:
      ack: "{ success }  # 방장이 나가면 다음 사람이 방장, 마지막 사람이 나가면 방 삭제"
  serverToClient:
    room:playerJoined:
      payload: "{ nickname, playersCount, players }  # 방 전체. 한 사람당 첫 연결 때 한 번만"
    room:playerLeft:
      payload: "{ nickname, playersCount, players }  # 방 전체. 방장이 바뀌면 players의 isHost에 반영"
    room:statusChanged:
      payload: "{ status: waiting | playing | ended }  # 방 전체. 게임 단계 담당 코드가 announceStatus로 보낸다"
    room:reset:
      payload: "{ players }  # 방 전체. 다시 하기로 대기실로 돌아감. 내 닉네임은 players에서 내 id로 찾는다"
  result:
    winner: humans | ai
    aiNickname: string
    isTie: boolean
    topVoted: string[]
    totalVotes: number
    tally: "[{ nickname, votes, isAi }]  # 득표 많은 순, 표를 못 받은 참가자와 AI 포함"
